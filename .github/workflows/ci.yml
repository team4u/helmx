name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests depend on workspace package dist artifacts (packages such as @helmx/kernel
      # have exports pointing at ./dist; TLS fixture / CLI end-to-end tests really import
      # or execute them). Build once first, then run typecheck/lint/hygiene/tests without
      # redundant rebuilds.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck:only

      - name: Lint
        run: pnpm lint

      - name: Check test hygiene
        run: pnpm check:hygiene

      # GitHub standard runners expose only 4 vCPUs. scripts/test-suites.mjs defaults to running as
      # many test files in parallel as there are vCPUs, yet every file spawns its own Hub/git/node
      # child processes, so the default 4-way fan-out oversubscribes the CPU on multi-turn chain tests
      # (observed as CI timing jitter). 3 workers keeps the dynamic IPC scheduling path (2 would fall
      # back to unbalanced static sharding) while leaving CPU headroom for the spawned child processes.
      - name: Run all tests on POSIX
        if: runner.os != 'Windows'
        run: pnpm test:all:run
        env:
          TEST_CONCURRENCY: '3'

      # Same 4 vCPU budget as the POSIX step above: 3 workers leave CPU headroom for Hub/git/node
      # child processes spawned by each test file (2 would fall back to static sharding).
      - name: Run unit tests on Windows
        if: runner.os == 'Windows'
        run: pnpm test:unit:run
        env:
          TEST_CONCURRENCY: '3'

      - name: Run cross-platform path regression tests on Windows
        if: runner.os == 'Windows'
        run: >-
          node scripts/run-tests.mjs
          packages/protocol/test/target-path-platform.test.ts
          packages/kernel/test/target-cwd.test.ts
          packages/kernel/test/target-platform-paths.test.ts
          packages/kernel/test/spawn-cwd-normalize.test.ts
          packages/hub/test/conversation-context.test.ts
          packages/node/test/node-local-env-win32-path.test.ts
