<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Helmx" />
    <title>Helmx</title>
    <script>
      ;(function () {
        function resolveTheme() {
          try {
            var saved = localStorage.getItem('helmx:theme')
            if (saved === 'dark' || saved === 'light') return saved
          } catch (_) {}
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          return systemDark ? 'dark' : 'light'
        }
        var theme = resolveTheme()
        document.documentElement.setAttribute('data-theme', theme)
        var color = theme === 'dark' ? '#1a1a1e' : '#f4f4f6'
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', color)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
